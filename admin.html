<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Disha Institute | Admin</title>

    <link rel="stylesheet" href="style.css">

    <style>

        body {
            background:#f4f6fa;
        }

        .admin-container {
            max-width:1200px;
            margin:auto;
            padding:40px 20px;
        }

        .admin-header {
            background:#111827;
            color:white;
            padding:25px 30px;
            border-radius:15px;
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-bottom:25px;
        }

        .dashboard-grid {
            display:grid;
            grid-template-columns:repeat(3,1fr);
            gap:20px;
            margin-bottom:30px;
        }

        .dashboard-card {
            background:white;
            padding:25px;
            border-radius:12px;
            border:1px solid #eee;
        }

        .dashboard-card strong {
            display:block;
            font-size:30px;
            color:#e51d2a;
            margin-top:10px;
        }

        .admin-panel {
            background:white;
            border-radius:15px;
            padding:30px;
            margin-bottom:25px;
        }

        .admin-panel h2 {
            margin-bottom:25px;
        }

        .form-group {
            margin-bottom:18px;
        }

        .form-group label {
            display:block;
            font-size:13px;
            font-weight:600;
            margin-bottom:7px;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width:100%;
            padding:12px;
            border:1px solid #ddd;
            border-radius:8px;
            outline:none;
            font-family:inherit;
        }

        .form-group textarea {
            min-height:100px;
            resize:vertical;
        }

        .add-btn {
            background:#e51d2a;
            color:white;
            border:none;
            padding:12px 20px;
            border-radius:8px;
            cursor:pointer;
            font-weight:600;
        }

        .data-table {
            width:100%;
            border-collapse:collapse;
        }

        .data-table th,
        .data-table td {
            text-align:left;
            padding:14px 10px;
            border-bottom:1px solid #eee;
            font-size:13px;
        }

        .action-btn {
            border:none;
            padding:7px 10px;
            border-radius:6px;
            cursor:pointer;
            margin-right:5px;
        }

        .edit {
            background:#fff3cd;
        }

        .delete {
            background:#ffe1e1;
            color:#d00;
        }

        .logout-btn {
            background:#333;
            color:white;
            border:none;
            padding:10px 15px;
            border-radius:7px;
            cursor:pointer;
        }

        @media(max-width:800px) {

            .dashboard-grid {
                grid-template-columns:1fr;
            }

            .data-table {
                display:block;
                overflow-x:auto;
            }

        }

    </style>

</head>


<body>


<div id="loginScreen">

    <div style="
        min-height:100vh;
        display:flex;
        align-items:center;
        justify-content:center;
        padding:20px;
    ">

        <div style="
            background:white;
            width:100%;
            max-width:400px;
            padding:35px;
            border-radius:18px;
            box-shadow:0 20px 50px rgba(0,0,0,.08);
        ">

            <div style="
                text-align:center;
                margin-bottom:30px;
            ">

                <div class="logo-box"
                     style="margin:auto">
                    D
                </div>

                <h2 style="margin-top:15px">
                    Institute Login
                </h2>

                <p style="
                    color:#777;
                    font-size:13px;
                    margin-top:7px;
                ">
                    Disha Computer Institute
                </p>

            </div>


            <div class="form-group">

                <label>
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    placeholder="Enter username"
                >

            </div>


            <div class="form-group">

                <label>
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter password"
                >

            </div>


            <button
                class="add-btn"
                onclick="login()"
                style="width:100%"
            >
                Login
            </button>


            <p
                id="loginError"
                style="
                    color:#e51d2a;
                    text-align:center;
                    margin-top:15px;
                    font-size:13px;
                "
            ></p>

        </div>

    </div>

</div>


<div id="dashboard"
     style="display:none">


<div class="admin-container">


    <div class="admin-header">

        <div>

            <h2>
                Institute Admin Dashboard
            </h2>

            <p style="
                color:#aaa;
                font-size:13px;
                margin-top:5px;
            ">
                Disha Computer Institute
            </p>

        </div>


        <button
            class="logout-btn"
            onclick="logout()"
        >
            Logout
        </button>

    </div>


    <div class="dashboard-grid">

        <div class="dashboard-card">

            Subjects

            <strong id="totalSubjects">
                0
            </strong>

        </div>


        <div class="dashboard-card">

            Notes

            <strong id="totalNotes">
                0
            </strong>

        </div>


        <div class="dashboard-card">

            Portal Status

            <strong style="font-size:18px">
                ● Active
            </strong>

        </div>

    </div>


    <!-- ADD SUBJECT -->

    <div class="admin-panel">

        <h2>
            Add Subject
        </h2>


        <div class="form-group">

            <label>
                Subject Name
            </label>

            <input
                id="subjectName"
                placeholder="Example: Java Programming"
            >

        </div>


        <div class="form-group">

            <label>
                Description
            </label>

            <textarea
                id="subjectDescription"
                placeholder="Enter subject description"
            ></textarea>

        </div>


        <div class="form-group">

            <label>
                Icon
            </label>

            <input
                id="subjectIcon"
                placeholder="Example: ☕"
            >

        </div>


        <button
            class="add-btn"
            onclick="addSubject()"
        >
            + Add Subject
        </button>

    </div>


    <!-- ADD NOTE -->

    <div class="admin-panel">

        <h2>
            Add Note
        </h2>


        <div class="form-group">

            <label>
                Select Subject
            </label>

            <select id="noteSubject">
            </select>

        </div>


        <div class="form-group">

            <label>
                Note / Chapter Name
            </label>

            <input
                id="noteTitle"
                placeholder="Example: Unit 1 - Introduction"
            >

        </div>


        <div class="form-group">

            <label>
                Description
            </label>

            <textarea
                id="noteDescription"
                placeholder="Enter note description"
            ></textarea>

        </div>


        <div class="form-group">

            <label>
                🌐 Online Notes Link
            </label>

            <input
                type="url"
                id="onlineLink"
                placeholder="https://..."
            >

        </div>


        <div class="form-group">

            <label>
                📄 PDF Notes Link
            </label>

            <input
                type="url"
                id="pdfLink"
                placeholder="https://..."
            >

        </div>


        <button
            class="add-btn"
            onclick="addNote()"
        >
            + Add Note
        </button>

    </div>


    <!-- SUBJECT TABLE -->

    <div class="admin-panel">

        <h2>
            Subjects
        </h2>

        <table class="data-table">

            <thead>

                <tr>

                    <th>
                        Subject
                    </th>

                    <th>
                        Notes
                    </th>

                    <th>
                        Actions
                    </th>

                </tr>

            </thead>

            <tbody id="subjectTable">

            </tbody>

        </table>

    </div>


    <!-- NOTES TABLE -->

    <div class="admin-panel">

        <h2>
            Notes
        </h2>

        <table class="data-table">

            <thead>

                <tr>

                    <th>
                        Subject
                    </th>

                    <th>
                        Note
                    </th>

                    <th>
                        Online
                    </th>

                    <th>
                        PDF
                    </th>

                    <th>
                        Actions
                    </th>

                </tr>

            </thead>

            <tbody id="notesTable">

            </tbody>

        </table>

    </div>


</div>

</div>


<script src="admin.js"></script>

</body>

</html>
